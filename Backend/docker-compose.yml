version: '3.8'

services:
  # NGINX Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: taxi_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: always

  # Node.js API Service (Express + Socket.IO + GraphQL)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxi_api
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taxipooling
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=supersecretjwtkeyforprod123!
      - JWT_REFRESH_SECRET=supersecretrefreshkeyforprod123!
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    restart: always

  # Dedicated BullMQ Background Worker Process
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxi_worker
    command: ["node", "src/workers/notificationWorker.js"]
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/taxipooling
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    restart: always

  # MongoDB Primary Database
  mongodb:
    image: mongo:6.0
    container_name: taxi_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  # Redis Ephemeral & Queue Data Store
  redis:
    image: redis:7-alpine
    container_name: taxi_redis
    command: redis-server --save 60 1 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  mongo_data:
  redis_data:
