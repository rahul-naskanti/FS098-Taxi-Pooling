events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  # Log format with Request Correlation ID and response times
  log_format production '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'request_time=$request_time upstream_response_time=$upstream_response_time';

  access_log /var/log/nginx/access.log production;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Enforce 10MB maximum request body limit for file uploads
  client_max_body_size 10M;

  # Upstream API backend service reference
  upstream taxi_backend {
    server api:5000;
  }

  server {
    listen 80;
    server_name localhost;

    # REST API Route Proxy
    location /api/ {
      proxy_pass http://taxi_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GraphQL Endpoint Proxy
    location /graphql {
      proxy_pass http://taxi_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO WebSocket Route Proxy (with HTTP Upgrade headers)
    location /socket.io/ {
      proxy_pass http://taxi_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # Base Health Status Check
    location /health {
      proxy_pass http://taxi_backend/api/health;
    }
  }
}
